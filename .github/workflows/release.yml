name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        id: vars
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 \
            dpkg-dev \
            curl \
            libcurl4-openssl-dev \
            wine \
            wget

      - name: Build Linux binary
        run: |
          gcc -O2 -o alwex alwex.c -lcurl -lm
          strip alwex

      - name: Build Windows binary
        run: |
          x86_64-w64-mingw32-gcc -O2 -o alwex.exe alwex.c -lwininet -lws2_32 -static
          strip alwex.exe

      - name: Prepare deb package
        run: |
          mkdir -p package/usr/bin
          cp alwex package/usr/bin/
          mkdir -p package/DEBIAN
          cat > package/DEBIAN/control << EOF
          Package: alwexscript
          Version: ${{ env.VERSION }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Alwex Developer <alwex0920@gmail.com>
          Description: AlwexScript interpreter
           AlwexScript is a lightweight scripting language.
          EOF
          dpkg-deb --build package alwexscript-${{ env.VERSION }}.deb

      - name: Install Inno Setup (portable)
        run: |
          curl -L -o is.exe "https://github.com/jrsoftware/issrc/releases/download/is-6_2_2/innosetup-6.2.2.exe" || \
          curl -L -o is.exe "https://jrsoftware.org/download.php/is.exe?ver=6.2.2"
          if [ ! -f is.exe ]; then
            echo "Failed to download Inno Setup"
            exit 1
          fi
          wine is.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART

      - name: Build Windows installer
        run: |
          cp alwex.exe .
          wine "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" setup.iss /DMyAppVersion=${{ env.VERSION }}
          mv AlwexScript-Setup-*.exe AlwexScript-Setup-${{ env.VERSION }}.exe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build VS Code extension
        run: |
          cd alwexscript-vscode
          npm install
          npm install -g vsce
          vsce package
          mv alwexscript-*.vsix ../alwexscript-${{ env.VERSION }}.vsix

      - name: Upload assets to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            alwex
            alwex.exe
            alwexscript-${{ env.VERSION }}.deb
            AlwexScript-Setup-${{ env.VERSION }}.exe
            alwexscript-${{ env.VERSION }}.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
